name: Keystore Generator Tool

on:
  workflow_dispatch:
    inputs:
      keystore_type:
        description: 'Keystore Type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: 'debug'
      alias_name:
        description: 'Key Alias (default: androiddebugkey for debug, upload for release)'
        required: false
        type: string
        default: ''
      validity_days:
        description: 'Validity in Days (default: 10000)'
        required: false
        type: number
        default: 10000

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        id: gen
        run: |
          TYPE="${{ inputs.keystore_type }}"
          DAYS="${{ inputs.validity_days }}"
          
          if [ "$TYPE" == "debug" ]; then
            FILE="debug.keystore"
            ALIAS="${{ inputs.alias_name }}"
            [ -z "$ALIAS" ] && ALIAS="androiddebugkey"
            PASS="android"
            DNAME="CN=Android Debug,O=Android,C=US"
          else
            FILE="release.keystore"
            ALIAS="${{ inputs.alias_name }}"
            [ -z "$ALIAS" ] && ALIAS="upload"
            PASS="android"
            DNAME="CN=Android Release,OU=Forge,O=Android,C=US"
          fi
          
          echo "==> Generating $TYPE keystore..."
          keytool -genkeypair -v \
            -keystore "$FILE" \
            -storepass "$PASS" \
            -alias "$ALIAS" \
            -keypass "$PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -dname "$DNAME"
            
          base64 -w 0 "$FILE" > "${FILE}.base64"
          echo "✔ Successfully generated $FILE and ${FILE}.base64"

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.keystore_type }}-keystore
          path: |
            *.keystore
            *.base64
          retention-days: 7
