name: Android CI & Build

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK and AAB bundle'
        required: false
        type: boolean
        default: true
      run_tests:
        description: 'Run unit and Robolectric tests'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  packages: read

jobs:
  # ============================================================================
  # 1. UNIT TESTING & VERIFICATION
  # ============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Keystores & Environment
        run: |
          chmod +x .github/scripts/generate-debug-keystore.sh
          ./.github/scripts/generate-debug-keystore.sh
          
          # Ensure .env exists so Secrets Gradle Plugin resolves smoothly
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "✔ Generated .env from .env.example"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew testDebugUnitTest --continue --stacktrace
          else
            gradle testDebugUnitTest --continue --stacktrace
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  # ============================================================================
  # 2. BUILD DEBUG APK
  # ============================================================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Keystores & Environment
        run: |
          chmod +x .github/scripts/generate-debug-keystore.sh
          ./.github/scripts/generate-debug-keystore.sh
          
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============================================================================
  # 3. BUILD RELEASE APK & APP BUNDLE (AAB)
  # ============================================================================
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Signing Keystores
        id: keystore-setup
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x .github/scripts/generate-debug-keystore.sh
          ./.github/scripts/generate-debug-keystore.sh
          
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "==> Decoding custom release keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
          else
            echo "==> No RELEASE_KEYSTORE_BASE64 secret provided. Creating fallback signing keystore for CI..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "ci_release_pass_123" \
              -alias "upload" \
              -keypass "ci_release_pass_123" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1000 \
              -dname "CN=CI Build,OU=Forge,O=Android,C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=ci_release_pass_123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ci_release_pass_123" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK & Bundle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            gradle assembleRelease bundleRelease --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: forge-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
